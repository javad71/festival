
# HTTP: Let's Encrypt validation + HTTPS redirect
server {
    listen 80;
    server_name nafas1405.ir www.nafas1405.ir;

    client_max_body_size 55m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name nafas1405.ir www.nafas1405.ir;

    client_max_body_size 55m;

    ssl_certificate /etc/letsencrypt/live/nafas1405.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nafas1405.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://app:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
