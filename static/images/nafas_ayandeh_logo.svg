<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">لوگوی جشنواره نفس‌های آینده</title>
  <desc id="desc">نماد خانواده، نوزاد، سالمندان، خورشید و برگ‌ها برای جشنواره نفس‌های آینده</desc>
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69bd45"/>
      <stop offset="1" stop-color="#008f8c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
